[package]
name = "mobius-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "The desktop app's gateway client: transport, gateway state and local files."

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
mobius.workspace = true
mobius-gateway.workspace = true
rust-embed = { version = "8.12", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mobius-gateway = { workspace = true, features = ["fixtures"] }

[features]
# Scripted screens for the app's snapshot harness; see `fixture`.
snapshot = ["mobius-gateway/fixtures"]

[lints]
workspace = true
