[package]
name = "mobius-desktop"
version = "0.17.20"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[package.metadata.bundle]
build-number = 68

[[bin]]
name = "mobius-desktop"
path = "src/main.rs"

[dependencies]
cef.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSData", "NSDictionary"] }
anyhow = "1"
gpui.workspace = true
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.17", features = ["runtime_shaders", "font-kit"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "system-proxy", "rustls-no-provider", "socks", "stream"] }
tempfile.workspace = true
mime_guess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# Use the same SVG parser and rasterizer as GPUI for morphable glyphs.
resvg = { version = "=0.46.0", default-features = false }
# Snapshot scenarios read the window's text selection, which only the base layer exposes.
gpui-base = { version = "=0.10.0", optional = true, features = ["gpui-fast"] }
gpui-component = { version = "0.10.0", features = ["gpui-fast", "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-toml", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-diff", "tree-sitter-markdown", "tree-sitter-html", "tree-sitter-css", "tree-sitter-yaml", "tree-sitter-markdown-inline", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-ruby"] }
mobius.workspace = true
mobius-client.workspace = true
mobius-gateway.workspace = true
serde.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
futures-util = { workspace = true, features = ["io"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64.workspace = true
rust-embed = { version = "8.12", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
lilt = "0.8.2"

[dev-dependencies]
# UI tests need client fixtures without enabling the app capture workflow.
mobius-client = { workspace = true, features = ["snapshot"] }
gpui = { workspace = true, features = ["test-support"] }
# Tests build transcripts with the gateway's own reducer; see mobius-client's fixture.rs.
mobius-gateway = { workspace = true, features = ["fixtures"] }

[features]
# Development-only screen capture; see tests/ui/snapshot/.
snapshot = ["dep:gpui-base", "gpui/test-support", "gpui_platform/test-support", "mobius-gateway/fixtures", "mobius-client/snapshot"]

[lints]
workspace = true
