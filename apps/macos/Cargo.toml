[package]
name = "mobius-desktop"
version = "0.17.8"
edition = "2024"
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/mobius"

[package.metadata.bundle]
build-number = 58

[[bin]]
name = "mobius-desktop"
path = "src/main.rs"

[workspace]
members = ["browser-helper", "crates/mobius-client"]

[workspace.package]
rust-version = "1.100.0"

[workspace.dependencies]
gpui = { package = "gpui-fast", version = "=0.1.14" }
# Chromium, embedded: one pinned CEF build shared by the app and its helper processes.
cef = { version = "=156.0.0", default-features = false, features = ["sandbox"] }
# The framework and gateway this app speaks to, from the same repository.
mobius = { path = "../.." }
mobius-gateway = { path = "../../crates/mobius-gateway" }

[dependencies]
cef.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL", "NSData", "NSDictionary"] }
anyhow = "1"
gpui.workspace = true
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.14", features = ["runtime_shaders", "font-kit"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "macos-system-configuration", "rustls-tls-native-roots", "socks", "stream"] }
tempfile = "3"
mime_guess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# Snapshot scenarios read the window's text selection, which only the base layer exposes.
gpui-base = { version = "=0.9.1", optional = true, features = ["gpui-fast"] }
gpui-component = { version = "=0.9.1", features = ["gpui-fast", "tree-sitter-rust", "tree-sitter-swift", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-toml", "tree-sitter-python", "tree-sitter-bash", "tree-sitter-diff", "tree-sitter-markdown", "tree-sitter-html", "tree-sitter-css", "tree-sitter-yaml", "tree-sitter-markdown-inline", "tree-sitter-go", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-ruby"] }
mobius.workspace = true
mobius-client = { path = "crates/mobius-client" }
mobius-gateway.workspace = true
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
futures-util = { version = "0.3", features = ["io"] }
tokio-util = { version = "0.7", features = ["rt"] }
base64 = "0.22"
rust-embed = { version = "8.12", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
lilt = "0.8.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Tests build transcripts with the gateway's own reducer; see mobius-client's fixture.rs.
mobius-gateway = { workspace = true, features = ["fixtures"] }

[features]
# Development-only screen capture; see src/ui/snapshot.rs.
snapshot = ["dep:gpui-base", "gpui/test-support", "gpui_platform/test-support", "mobius-gateway/fixtures", "mobius-client/snapshot"]

[lints]
workspace = true

[workspace.lints.rust]
# Tier 1: hygiene that costs nothing to keep.
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_numeric_casts = "deny"
unexpected_cfgs = "deny"
# Tier 2: never drop a value or a type's debug view silently.
let_underscore_drop = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "warn"
# FFI into AppKit, CEF and the Objective-C runtime: every unsafe block states its SAFETY.
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "warn"
# Tier 1: no stubs or leftovers; every exception says why; share handles explicitly.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
unwrap_in_result = "deny"
missing_panics_doc = "deny"
future_not_send = "deny"
unused_async = "deny"
rc_buffer = "deny"
trivially_copy_pass_by_ref = "deny"
needless_collect = "deny"
uninlined_format_args = "deny"
# Tier 2: errors are never swallowed; numbers convert checked; locks are held briefly.
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
string_slice = "deny"
significant_drop_tightening = "deny"
needless_pass_by_value = "deny"
str_to_string = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Tier 3: production code never panics on expected failures; tests may (clippy.toml).
expect_used = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# Tier 4: nursery lints that fit the rulebook.
significant_drop_in_scrutinee = "deny"
needless_pass_by_ref_mut = "deny"
or_fun_call = "deny"
collection_is_never_read = "deny"
set_contains_or_insert = "deny"
derive_partial_eq_without_eq = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
unused_peekable = "deny"
useless_let_if_seq = "deny"
branches_sharing_code = "deny"
use_self = "deny"
large_stack_frames = "deny"
# Tier 5: pedantic lints that simplify control flow, avoid allocations and keep hygiene.
single_match_else = "deny"
match_same_arms = "deny"
manual_let_else = "deny"
if_not_else = "deny"
collapsible_else_if = "deny"
nonminimal_bool = "deny"
match_bool = "deny"
match_wildcard_for_single_variants = "deny"
unnested_or_patterns = "deny"
needless_continue = "deny"
bool_to_int_with_if = "deny"
map_unwrap_or = "deny"
format_push_string = "deny"
format_collect = "deny"
assigning_clones = "deny"
unnecessary_debug_formatting = "deny"
wildcard_imports = "deny"
used_underscore_binding = "deny"
ignored_unit_patterns = "deny"
semicolon_if_nothing_returned = "deny"
items_after_statements = "deny"
unused_self = "deny"
unnecessary_wraps = "deny"
ref_option = "deny"
redundant_closure_for_method_calls = "deny"
elidable_lifetime_names = "deny"
explicit_iter_loop = "deny"
inconsistent_struct_constructor = "deny"
needless_raw_string_hashes = "deny"
unreadable_literal = "deny"
manual_midpoint = "deny"
case_sensitive_file_extension_comparisons = "deny"
cast_precision_loss = "deny"

[profile.dev]
debug = 0

# Layout and rendering dominate each frame; unoptimized they make debug builds stutter.
[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.release]
lto = "thin"
strip = "debuginfo"

# gpui-component needs this upstream release, which is not yet in our registry mirror.
[patch.crates-io]
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "d97971e24500218865c05ed1febdee2acf41bae1" }
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "d97971e24500218865c05ed1febdee2acf41bae1" }

# Kit selects Fast but still declares this unused backend; the empty crate has no renderer.
gpui-pre = { path = "vendor/gpui-pre" }

# GPU-presented motion: implementation and proposed API exception are in vendor/README.md.
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-apple = { path = "vendor/gpui-fast-apple" }
