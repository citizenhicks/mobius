[package]
name = "mobius-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "The desktop app's gateway client: transport, gateway state and local files."

[dependencies]
anyhow = "1"
base64.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
mobius.workspace = true
mobius-gateway.workspace = true
rust-embed = { version = "8.12", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
mobius-gateway = { workspace = true, features = ["fixtures"] }

[features]
# Scripted screens for the app's snapshot harness; see `fixture`.
snapshot = ["mobius-gateway/fixtures"]

[lints]
workspace = true
