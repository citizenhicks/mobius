[package]
name = "mobius-gateway"
version = "0.16.28"
edition.workspace = true
rust-version.workspace = true
description = "Headless authenticated gateway for möbius frontends"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true
keywords = ["agent", "ai", "gateway", "llm", "server"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mobius_gateway"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
croner = "3"
futures-util.workspace = true
mobius.workspace = true
rusqlite.workspace = true
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
toml = "1"
tracing.workspace = true
uuid.workspace = true
url = "2"
webpki-roots = "1"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
plist = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["hostname", "signal", "user"] }

[lints]
workspace = true
