[package]
name = "mobius-gateway"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
description = "Headless authenticated gateway for möbius frontends"
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/mobius"
readme = "README.md"
publish = ["crates-io"]
keywords = ["agent", "ai", "gateway", "llm", "server"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mobius_gateway"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
croner = "3"
futures-util = { version = "0.3", features = ["sink"] }
mobius = { version = "=0.11.0", path = "../.." }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
toml = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["hostname", "signal"] }

[lints]
workspace = true
