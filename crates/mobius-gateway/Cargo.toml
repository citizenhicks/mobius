[package]
name = "mobius-gateway"
version = "0.15.14"
edition.workspace = true
rust-version.workspace = true
description = "Headless authenticated gateway for möbius frontends"
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = ["macos/**"]
publish.workspace = true
keywords = ["agent", "ai", "gateway", "llm", "server"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mobius_gateway"
path = "src/lib.rs"

[dependencies]
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
clap.workspace = true
croner = "3"
futures-util.workspace = true
mobius.workspace = true
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
toml = "1"
uuid.workspace = true
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["hostname", "signal"] }

[lints]
workspace = true
