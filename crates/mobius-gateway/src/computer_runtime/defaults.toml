# Each settings table is complete; `{}` gives a nested table its own defaults.

[computer]
mode = "managed"
install_timeout_seconds = 600
node_download_base_url = "https://nodejs.org/dist"
tar_executable = "tar"
download_connect_timeout_seconds = 30
download_timeout_seconds = 180
browser = {}
desktop = {}

[browser]
sandbox = true
arguments = ["--no-first-run", "--no-default-browser-check", "--disable-infobars"]
window_size = [1200, 640]
window_position = [80, 42]
start_page = "about:blank"
viewport = [1365, 768]

[desktop]
resolution = [1365, 768]
depth = 24
display_start = 100
display_end = 200
startup_timeout_seconds = 15
tools = {}
window_manager = {}
panel = {}
wallpaper = {}
terminal = {}
files = {}
branding = {}

[desktop_tools]
xauth = "xauth"
xvnc = ["Xtigervnc", "Xvnc"]
vncconfig = ["tigervncconfig", "vncconfig"]
setpriv = "setpriv"

[desktop_application]
enabled = true

[desktop_branding]
browser_label = "Browser"
terminal_label = "Terminal"
files_label = "Files"

[node]
version = "26.13.1"

[node.distributions.macos-aarch64]
platform = "darwin-arm64"
checksum = "aec2514ea1ceb2ba52455e9ec65986f6749a06dd759e5db2a72e6889668c9735"

[node.distributions.macos-x86_64]
platform = "darwin-x64"
checksum = "82bb96078a24ca50b9c9a38f2379e6be6d87171fcd400fc14c8934b3bce96e2f"

[node.distributions.linux-aarch64]
platform = "linux-arm64"
checksum = "80a330b35415382878df18d41afbd106ea89bfb3be0087d6608e289a14c5cc7d"

[node.distributions.linux-x86_64]
platform = "linux-x64"
checksum = "518674de2b621728a5e4486f5fb3b7d2900bb3cc4aa97969edaa463db99f9778"

[applications.window_manager]
executable = "openbox"
arguments = []

[applications.panel]
executable = "tint2"
arguments = []

[applications.wallpaper]
executable = "feh"
arguments = ["--no-fehbg", "--bg-fill"]

[applications.terminal]
executable = "xterm"
arguments = ["-title", "Terminal", "-fa", "Liberation Mono", "-fs", "12"]

[applications.files]
executable = "pcmanfm"
arguments = ["--new-win", "--profile=mobius"]
