[package]
name = "mobius"
version = "0.17.21"
edition.workspace = true
rust-version.workspace = true
description = "A small, modular Rust framework for building coding agents"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/mobius"
readme = "../../README.md"
publish.workspace = true
keywords = ["agent", "ai", "llm", "openai", "tools"]
categories = ["asynchronous", "development-tools"]
include = [
    "/src/**",
    "!/src/middleware/tools/tests/apply_patch_scenarios/**",
    "/tests/**",
    "/Cargo.toml",
    "/LICENSE",
    "/NOTICE",
]

[lints]
workspace = true

[dependencies]
base64.workspace = true
bm25 = "2.3.2"
cap-std = "4"
chrono.workspace = true
diffy.workspace = true
futures-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
regex = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true
toml = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
whichdisk = { version = "0.6", default-features = false }

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
