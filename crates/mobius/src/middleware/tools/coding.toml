# Tool schemas, presentation, and prompts owned by coding.

[read_file]
title = "Read"
detail = "path"
link_path = "path"
group = "read"

[read_file.tool]
name = "read_file"
description = "Read a UTF-8 text file, or view a PNG, JPEG, WebP or GIF image, under the active sandbox policy. Supply path or an authorized image file_id, never both. Read the current text before editing."

[read_file.tool.parameters]
type = "object"
oneOf = [{ required = ["path"] }, { required = ["file_id"] }]
additionalProperties = false

[read_file.tool.parameters.properties.path]
type = "string"
description = "Workspace-relative path such as `src/main.rs`, or an absolute path allowed by the active sandbox policy."

[read_file.tool.parameters.properties.file_id]
type = "string"
description = "An image file ID authorized in this session."

[write_file]
title = "Write"
detail = "path"
link_path = "path"

[write_file.tool]
name = "write_file"
description = "Create or completely replace a UTF-8 file under the active sandbox policy. Read existing contents first; use apply_patch for a targeted edit."

[write_file.tool.parameters]
type = "object"
required = ["path", "content"]
additionalProperties = false

[write_file.tool.parameters.properties]

[write_file.tool.parameters.properties.path]
type = "string"

[write_file.tool.parameters.properties.content]
type = "string"
description = "Complete file text, at most {max_bytes} bytes. For larger files, write the first part, then add the rest with apply_patch."

[apply_patch]
title = "Patch"
detail = ""
prompt = """Before editing an existing file, read its current contents and enough surrounding context. Build patches only from that exact text. Put every file of one change in one patch, each file once:
*** Begin Patch
*** Add File: path            (then every line starts with +)
*** Delete File: path
*** Update File: path
*** Move to: new/path         (optional, right after Update File)
@@ optional context line, such as the enclosing definition
 unchanged line
-removed line
+added line
*** End of File               (optional, when the change ends the file)
*** End Patch
Changes in one file go in file order. Add File creates parent folders but never replaces an existing file; use Update File. Do not use numbered unified-diff ranges or Markdown fences."""

[apply_patch.tool]
name = "apply_patch"
description = "Add, update, move and delete files in one patch under the active sandbox policy, using exact text from their current contents. The whole patch is checked before anything is written."

[apply_patch.tool.parameters]
type = "object"
required = ["patch"]
additionalProperties = false

[apply_patch.tool.parameters.properties]

[apply_patch.tool.parameters.properties.patch]
type = "string"
description = "One `apply_patch` envelope, at most {max_bytes} bytes, with `*** Add File`, `*** Update File` (optionally `*** Move to`) and `*** Delete File` operations."
