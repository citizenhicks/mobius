[package]
name = "mobius-cli"
version = "0.15.20"
edition.workspace = true
rust-version.workspace = true
description = "The terminal client for a möbius gateway"
license.workspace = true
repository.workspace = true
readme = "README.md"
publish.workspace = true
keywords = ["agent", "ai", "cli", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mobius"
path = "src/main.rs"
doc = false

[[bin]]
name = "mobius-gateway"
path = "src/gateway_main.rs"
doc = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
chrono.workspace = true
clap.workspace = true
diffy.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
mobius.workspace = true
mobius-gateway = { version = "=0.15.20", path = "../mobius-gateway" }
pulldown-cmark = { version = "0.10", default-features = false }
ratatui = { version = "0.30.2", features = [
    "scrolling-regions",
    "unstable-rendered-line-info",
] }
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
uuid.workspace = true

[dev-dependencies]
clap_mangen = "0.3.3"

[lints]
workspace = true
