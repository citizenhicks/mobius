[package]
name = "mobius-cli"
version = "0.14.2"
edition = "2024"
rust-version = "1.98"
description = "The terminal client for a möbius gateway"
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/mobius"
readme = "README.md"
publish = ["crates-io"]
keywords = ["agent", "ai", "cli", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mobius"
path = "src/main.rs"
doc = false

[[bin]]
name = "mobius-gateway"
path = "src/gateway_main.rs"
doc = false

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
chrono = "0.4"
diffy = "0.4.2"
image = { version = "0.25", default-features = false, features = ["png"] }
mobius = { version = "=0.14.2", path = "../.." }
mobius-gateway = { version = "=0.14.2", path = "../mobius-gateway" }
pulldown-cmark = { version = "0.10", default-features = false }
ratatui = { version = "0.30.2", features = [
    "scrolling-regions",
    "unstable-rendered-line-info",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
