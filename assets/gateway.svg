<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="640" height="320" role="img" aria-label="A message from the terminal reaches a bot on your gateway, goes to a model provider and back, runs a tool in the workspace, and the result streams to the Mac, terminal and iPhone at once.">
<!-- ponytail: generated by a throwaway script; a self-painted dark board reads the same on GitHub light and dark -->
<style>
.bg { fill: #151718; }
.minor { fill: none; stroke: #1e2123; stroke-width: 0.4; }
.frame { fill: none; stroke: #3c4044; stroke-width: 0.6; }
.tick { fill: none; stroke: #3c4044; stroke-width: 3; stroke-dasharray: 0.5 9.5; }
.win { fill: #151718; stroke: #8a8f94; stroke-width: 0.6; }
.panel { fill: none; stroke: #33373a; stroke-width: 0.6; }
.sel { fill: none; stroke: #c8ccd0; stroke-width: 0.7; opacity: 0; }
.sel-g { opacity: 1; }
.ln { fill: none; stroke: #6b7075; stroke-width: 0.6; }
.dash { stroke-dasharray: 1.5 1.5; }
.node { fill: #5f7f6a; fill-opacity: 0; stroke: #c8ccd0; stroke-width: 0.7; transform-box: fill-box; transform-origin: center; }
.dim { stroke: #6b7075; }
.dot { fill: #8a8f94; }
.tok { fill: #e8f1ea; }
.fan { opacity: 0; }
text { font: 5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c8ccd0; }
.lbl { fill: #8a8f94; }
.mid { text-anchor: middle; }
@media (prefers-reduced-motion: no-preference) {
  * { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(0.45, 0, 0.3, 1); animation-fill-mode: both; }
  .flash { animation-name: flash; }
  @keyframes flash { 0%, 14%, 100% { fill-opacity: 0; } 3%, 9% { fill-opacity: 0.9; } }
  .sel-c { animation-name: selc; animation-timing-function: steps(1, end); }
  .sel-g { animation-name: selg; animation-timing-function: steps(1, end); }
  .sel-p { animation-name: selp; animation-timing-function: steps(1, end); }
  @keyframes selc { 0% { opacity: 1; } 9% { opacity: 0; } 74% { opacity: 1; } }
  @keyframes selg { 0% { opacity: 0; } 9% { opacity: 1; } 28% { opacity: 0; } 46% { opacity: 1; } 74% { opacity: 0; } }
  @keyframes selp { 0% { opacity: 0; } 28% { opacity: 1; } 46% { opacity: 0; } }
  .t0 { animation-name: t0; }
  .t1 { animation-name: t1; }
  .t2 { animation-name: t2; }
  /* terminal -> bus -> bot -> cloud -> bot -> workspace (tool) -> bot -> bus -> terminal */
  @keyframes t0 {
    0% { opacity: 0; transform: translate(56px, 64px); }
    4% { opacity: 1; transform: translate(56px, 64px); }
    8% { transform: translate(70px, 64px); }
    11% { transform: translate(80px, 64px); }
    14% { transform: translate(80px, 46px); }
    20%, 24% { transform: translate(136px, 46px); }
    32%, 38% { transform: translate(182px, 46px); }
    46%, 48% { transform: translate(136px, 46px); }
    54%, 60% { transform: translate(136px, 78px); }
    64% { transform: translate(136px, 46px); }
    68% { transform: translate(80px, 46px); }
    71% { transform: translate(80px, 64px); }
    74% { transform: translate(70px, 64px); }
    80%, 86% { opacity: 1; transform: translate(56px, 64px); }
    94%, 100% { opacity: 0; transform: translate(56px, 64px); }
  }
  /* the same event fans out to the other clients */
  @keyframes t1 {
    0%, 72% { opacity: 0; transform: translate(70px, 64px); }
    74% { opacity: 1; transform: translate(70px, 64px); }
    77% { transform: translate(70px, 46px); }
    80%, 86% { opacity: 1; transform: translate(56px, 46px); }
    94%, 100% { opacity: 0; transform: translate(56px, 46px); }
  }
  @keyframes t2 {
    0%, 72% { opacity: 0; transform: translate(70px, 64px); }
    74% { opacity: 1; transform: translate(70px, 64px); }
    77% { transform: translate(70px, 84px); }
    80%, 86% { opacity: 1; transform: translate(50px, 84px); }
    94%, 100% { opacity: 0; transform: translate(50px, 84px); }
  }
}
</style>
<defs><pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse"><path class="minor" d="M8 0H0V8"/></pattern></defs>
<rect class="bg" width="240" height="120" rx="3"/>
<rect width="240" height="120" fill="url(#grid)"/>
<rect class="frame" x="8" y="8" width="224" height="104" rx="1.5"/>
<path class="tick" d="M8 8H232M8 112H232M8 8V112M232 8V112"/>
<rect class="win" x="16" y="14" width="208" height="94" rx="1.5"/>
<circle class="dot" cx="21" cy="19" r="1" style="fill:#c8ccd0"/><circle class="dot" cx="25" cy="19" r="1"/><circle class="dot" cx="29" cy="19" r="1"/>
<rect class="panel" x="22" y="26" width="44" height="76" rx="1.5"/>
<rect class="panel" x="74" y="26" width="92" height="76" rx="1.5"/>
<rect class="panel" x="174" y="26" width="44" height="76" rx="1.5"/>
<text class="lbl" x="26" y="33">clients</text>
<text class="lbl" x="78" y="33">gateway</text>
<text class="lbl" x="178" y="33">providers</text>
<path class="sel sel-c" d="M19.5 29.5V23.5H25.5M62.5 23.5H68.5V29.5M68.5 98.5V104.5H62.5M25.5 104.5H19.5V98.5"/>
<path class="sel sel-g" d="M71.5 29.5V23.5H77.5M162.5 23.5H168.5V29.5M168.5 98.5V104.5H162.5M77.5 104.5H71.5V98.5"/>
<path class="sel sel-p" d="M171.5 29.5V23.5H177.5M214.5 23.5H220.5V29.5M220.5 98.5V104.5H214.5M177.5 104.5H171.5V98.5"/>
<path class="ln" d="M56 46H70V84M56 64H80V46H88M50 84H70M136 52V72M144 46H182M160 46V78H182"/>
<rect class="node flash" style="animation-delay:6.24s" x="32" y="40" width="24" height="12" rx="1"/>
<rect class="node flash" style="animation-delay:6.24s" x="32" y="58" width="24" height="12" rx="1"/>
<rect class="node flash" style="animation-delay:6.24s" x="38" y="76" width="12" height="16" rx="1.5"/>
<text class="mid" x="44" y="47.8">mac</text><text class="mid" x="44" y="65.8">&gt;_</text>
<rect class="node flash" style="animation-delay:1.36s" x="88" y="40" width="56" height="12" rx="1"/>
<rect class="node flash" style="animation-delay:4.16s" x="88" y="72" width="56" height="12" rx="1"/>
<text x="92" y="47.8">bot</text><text x="92" y="79.8">workspace</text>
<rect class="node flash" style="animation-delay:2.4s" x="182" y="40" width="28" height="12" rx="1"/>
<rect class="node dim dash" x="182" y="72" width="28" height="12" rx="1"/>
<text class="mid" x="196" y="47.8">cloud</text><text class="mid lbl" x="196" y="79.8">local</text>
<circle class="tok t0" r="1.8" transform="translate(136 46)"/>
<circle class="tok fan t1" r="1.8" transform="translate(70 64)"/>
<circle class="tok fan t2" r="1.8" transform="translate(70 64)"/>
</svg>
