# Provider-owned model catalog, verified 2026-11-12 against docs.mistral.ai.
# A model without `reasoning` accepts every listed effort.
default_model = "mistral-large-4-0"

[[reasoning]]
id = "none"
label = "None"
description = "Think minimally without a visible reasoning trace"

[[reasoning]]
id = "minimal"
label = "Minimal"
description = "Use minimal reasoning"

[[reasoning]]
id = "low"
label = "Low"
description = "Prefer speed and lower cost"

[[reasoning]]
id = "medium"
label = "Medium"
description = "Balance speed and reasoning"

[[reasoning]]
id = "high"
label = "High"
description = "Use deeper reasoning for agentic and coding tasks"

[[reasoning]]
id = "xhigh"
label = "Extra high"
description = "Use the highest native reasoning effort"

[[models]]
id = "mistral-large-4-0"
label = "Mistral Large 4"
description = "Mistral's flagship multimodal reasoning model, in public preview"
default_reasoning = "high"
context_window = 1000000
tool_discovery = "rebuild"
reasoning = ["low", "medium", "high"]

[[models]]
id = "mistral-small-2603"
label = "Mistral Small 4"
description = "Mistral's efficient multimodal reasoning and coding model"
default_reasoning = "high"
context_window = 256000
tool_discovery = "rebuild"
