[provider]
label = "Anthropic"
description = "Native Messages API with adaptive thinking"
default_model = "claude-sonnet-5"
tool_discovery = "rebuild"
custom_endpoint_tool_discovery = "rebuild"
web_search = ["off", "live"]

[[reasoning]]
id = "low"
label = "Low"
description = "Prefer speed and lower cost"

[[reasoning]]
id = "medium"
label = "Medium"
description = "Balance reasoning and latency"

[[reasoning]]
id = "high"
label = "High"
description = "Anthropic's default reasoning effort"

[[reasoning]]
id = "xhigh"
label = "Extra high"
description = "Extended effort for long-horizon work"

[[reasoning]]
id = "max"
label = "Maximum"
description = "Use maximum available reasoning"

[[models]]
id = "claude-sonnet-5"
label = "Claude Sonnet 5"
description = "Fast frontier model for coding and agents"
context_window = 1000000
reasoning = ["low", "medium", "high", "xhigh", "max"]
default_reasoning = "high"

[[models]]
id = "claude-opus-4-8"
label = "Claude Opus 4.8"
description = "Highest-capability Anthropic model"
context_window = 1000000
reasoning = ["low", "medium", "high", "xhigh", "max"]
default_reasoning = "high"
tool_discovery = "native"

[[models]]
id = "claude-haiku-4-5"
label = "Claude Haiku 4.5"
description = "Fast, economical Anthropic model"
context_window = 200000
tool_discovery = "native"
