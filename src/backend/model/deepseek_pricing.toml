# https://api-docs.deepseek.com/quick_start/pricing/ verified 2026-10-04.
# effective_from records first observation, not an inferred upstream change date.
# Rates are micro-USD per million tokens. Legacy Flash IDs bill as V4.1 Flash.
# Model::pricing resolves current-time rates, not historical request billing.
# Without a verified holiday calendar, possible weekday peak windows are unknown;
# off-peak times remain exact. No holiday dates are guessed or shipped.
# To supply authoritative coverage, add [tariffs.holiday_calendar] to each tariff:
# start_date/end_date are inclusive YYYY-MM-DD strings; public_holidays is the
# complete list within that coverage. Calendar dates use UTC, like peak windows.

[[tariffs]]
models = ["deepseek-flash", "deepseek-v4-flash", "deepseek-v4-flash-vision-exp"]
effective_from = 1791043200
peak_weekdays = [1, 2, 3, 4, 5]
peak_windows = [
    { start_hour_utc = 1, end_hour_utc = 4 },
    { start_hour_utc = 6, end_hour_utc = 10 },
]

[tariffs.off_peak]
input_microusd_per_million = 150000
cached_input_microusd_per_million = 3000
cache_write_input_microusd_per_million = 150000
output_microusd_per_million = 600000

[tariffs.peak]
input_microusd_per_million = 300000
cached_input_microusd_per_million = 6000
cache_write_input_microusd_per_million = 300000
output_microusd_per_million = 1200000

[[tariffs]]
models = ["deepseek-v4-pro"]
effective_from = 1791043200
peak_weekdays = [1, 2, 3, 4, 5]
peak_windows = [
    { start_hour_utc = 1, end_hour_utc = 4 },
    { start_hour_utc = 6, end_hour_utc = 10 },
]

[tariffs.off_peak]
input_microusd_per_million = 660000
