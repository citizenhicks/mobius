# Provider wire mappings; image models and their quality levels live in provider catalogs.

[openai]
generation_path = "images/generations"
edit_path = "images/edits"
reference_format = "multipart"
size_format = "pixels"
input_tokens = "/input_tokens"
output_tokens = "/output_tokens"

[codex]
generation_path = "images/generations"
edit_path = "images/edits"
reference_format = "image_urls"
size_format = "pixels"
input_tokens = "/input_tokens"
output_tokens = "/output_tokens"

[openrouter]
generation_path = "images"
edit_path = "images"
reference_format = "input_references"
size_format = "aspect_ratio"
input_tokens = "/prompt_tokens"
output_tokens = "/completion_tokens"
