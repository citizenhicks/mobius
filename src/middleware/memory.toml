editor_global_description = "A global memory page is context for every Bot in every project. Its first line becomes its description."
editor_global_title = "Add global memory"
editor_label = "Memory"
editor_submit = "Add"
manifest_description = "A wiki of linked memory pages for this Bot or every Bot, distilled while chats sit idle"
manifest_label = "Memory"
message_added = "Saved the memory page."
message_agent_observation = "agent observation"
message_forgot = "Forgot the memory page."
message_global_heading = "Global"
message_no_project = "No project"
