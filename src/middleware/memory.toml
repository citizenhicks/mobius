[write_memory]
result_title = "write_memory"
title = "Remember"
detail = "memory"

[write_memory.tool]
name = "write_memory"
description = "Save one concise fact, preference, or reusable lesson that should help future chats; every write requires approval. Write one fact per memory and update an existing memory by its id instead of adding a near-duplicate. Memories are knowledge, not a task handoff or reasoning log: never store private reasoning, raw outputs, secrets, credentials, or transient progress. A memory is visible only to this Bot in this project unless `global` is true."

[write_memory.tool.parameters]
type = "object"
required = ["memory"]
additionalProperties = false

[write_memory.tool.parameters.properties]

[write_memory.tool.parameters.properties.memory]
type = "string"
description = "One concise reusable fact, at most 500 UTF-8 bytes. Each memory scope has a small total size limit."

[write_memory.tool.parameters.properties.global]
type = "boolean"
description = "Share this new memory with every Bot in every project. Defaults to false: only this Bot in this project sees it."

[write_memory.tool.parameters.properties.id]
type = "string"
description = "Replace the text of this existing memory instead of adding a new one."

[forget_memory]
result_title = "forget_memory"
title = "Forget"
detail = "id"

[forget_memory.tool]
name = "forget_memory"
description = "Forget one memory by its id when it is wrong or no longer useful; requires approval."

[forget_memory.tool.parameters]
type = "object"
required = ["id"]
additionalProperties = false

[forget_memory.tool.parameters.properties]

[forget_memory.tool.parameters.properties.id]
type = "string"
description = "The id of the memory to forget."
