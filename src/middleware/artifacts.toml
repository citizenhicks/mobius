default_enabled = true
# Editable text and defaults owned by this middleware.
manifest_description = "Let the agent publish workspace files to the current chat"
manifest_label = "Artifacts"
prompt_main = "Use `send_artifact` to deliver an existing workspace file or an authorized stored file_id without rewriting it. Create a file only when the user asks for new content."
render_sent_prefix = "Sent "
error_path_not_file = "artifact path must name one file"
error_path_or_file_id = "provide exactly one of path or file_id"

[send_artifact]
result_title = "send_artifact"
title = "Send"
detail = "path"

[send_artifact.tool]
name = "send_artifact"
description = "Send one existing workspace file or authorized stored file without editing it. Use its returned `file_id` or workspace `path`; supply exactly one. Create a file first only if new content was requested."

[send_artifact.tool.parameters]
type = "object"
oneOf = [{ "required" = ["path"] }, { "required" = ["file_id"] }]
additionalProperties = false

[send_artifact.tool.parameters.properties]

[send_artifact.tool.parameters.properties.file_id]
type = "string"
description = "Authorized stored file ID to publish without copying bytes."

[send_artifact.tool.parameters.properties.path]
type = "string"
description = "Workspace-relative path to the finished file."
