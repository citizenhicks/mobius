default_enabled = false
# Editable text and defaults owned by this middleware.
command_tasks_description = "show the current todo list"
manifest_description = "Maintain a durable todo list for multi-step work"
manifest_label = "Tasks"
prompt_main = "Use `write_todos` only for genuinely multi-step work. Keep the list short, mark work in_progress before starting and completed immediately after finishing, and end with a substantive answer. A <tasks> block restores the authoritative saved list when context restarts."
render_empty = "No tasks."
render_pending = "[ ]"
render_in_progress = "[~]"
render_completed = "[x]"
result_updated = "updated {count} todos"
error_count = "todo count exceeds {max}"
error_content = "todo content must be 1–{max} bytes"
prompt_projection = "<tasks>\nCurrent saved todo list replaces all prior task-list state:\n{todos}\n</tasks>"

[write_todos]
result_title = "write_todos"
title = "Tasks"
detail = ""
count = "todos"

[write_todos.tool]
name = "write_todos"
description = "Replace the session todo list with the complete desired list; omitted items are removed, and an empty list clears it."

[write_todos.tool.parameters]
type = "object"
required = ["todos"]
additionalProperties = false

[write_todos.tool.parameters.properties]

[write_todos.tool.parameters.properties.todos]
type = "array"

[write_todos.tool.parameters.properties.todos.items]
type = "object"
required = ["content", "status"]
additionalProperties = false

[write_todos.tool.parameters.properties.todos.items.properties]

[write_todos.tool.parameters.properties.todos.items.properties.content]
type = "string"

[write_todos.tool.parameters.properties.todos.items.properties.status]
type = "string"
enum = ["pending", "in_progress", "completed"]
