[manifest]
label = "Tasks"
description = "Maintain a durable todo list for multi-step work"

[prompt]
main = "Use `write_todos` only for genuinely multi-step work. Keep the list short, mark work in_progress before starting and completed immediately after finishing, and end with a substantive answer. A <tasks> block restores the authoritative saved list when context restarts."

[command.tasks]
description = "show the current todo list"

[render]
heading = "Tasks"
empty = "No tasks."

[tool.write_todos]
description = "Replace the session todo list; an empty list clears it."
