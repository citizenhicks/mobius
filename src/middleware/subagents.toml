[manifest]
label = "Subagents"
description = "Delegate independent work to durable child agents"

[prompt]
root = "Delegate independent work to subagents when it can run in parallel. Spawn with fresh context by default; include recent turns only when the task requires them, and full history only when essential. They share your workspace; continue your own work while they run, and wait only when you need their results."
default = "Complete the task and report concisely to your parent."

[setting.model_route]
label = "Default model"
description = "Model route used by child agents when a spawn does not select one"
unset_label = "Inherit parent"

[setting.max_depth]
label = "Maximum depth"
description = "Maximum child-agent nesting depth"
step = 1

[setting.max_concurrency]
label = "Maximum concurrency"
description = "Maximum active agents, including the root"
step = 1

[setting.max_agents]
label = "Maximum agents"
description = "Maximum retained agents, including the root"
step = 1

[defaults]
wait_ms = 30000
max_depth = 4
max_concurrency = 8
max_agents = 32

[command]
description = "open a subagent thread"

[render]
agent = "Agent"
message = "Message"
follow_up = "Follow up"
agents = "Agents"
interrupt = "Interrupt"
wait = "Wait"
open = "Open subagent"
empty = "no subagents"

[tool.spawn_agent]
description = "Start an async child for independent work in this chat's subagent task tree; return its canonical task path."

[tool.spawn_agent.parameter.task_name]
description = "1-64 lowercase letters, digits, or underscores."

[tool.spawn_agent.parameter.fork_turns]
description = "`none` for a fresh child (default), a positive integer for required recent turns, or `all` only when full history is essential."

[tool.spawn_agent.parameter.model]
description = "Registered route; defaults to the child route, then parent."

[tool.spawn_agent.parameter.reasoning_effort]
description = "Reasoning effort for the selected model; defaults to middleware configuration."

[tool.send_message]
description = "Send collaboration context to a running agent in this chat's subagent task tree. A child may message its parent at the parent's canonical path, including /root."

[tool.followup_task]
description = "Send follow-up work to a subagent in this chat's task tree, starting a turn if idle. Cannot target /root."

[tool.parameter.target]
description = "Exact canonical task path from spawn_agent or list_agents, such as /root/reviewer; not a Bot handle or Bot ID."

[tool.list_agents]
description = "List this chat's subagents and their canonical task paths; does not list peer Bots."

[tool.interrupt_agent]
description = "Interrupt a subagent in this chat's task tree and return its prior status. Cannot target /root."

[tool.wait_agent]
description = "Wait for an update from this chat's subagent task tree."
