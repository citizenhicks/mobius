default_enabled = false
default_timeout_ms = 30000
manifest_label = "Computer control"
manifest_description = "Operate a browser and supported native apps with persistent JavaScript and image observations"
prompt = "`computer_control`: drive the browser and desktop; read {documentation} before first use."

[computer_control]
title = "Computer"

[computer_control.tool]
name = "computer_control"
description = "Evaluate JavaScript in this session's persistent computer runtime. Read the installed documentation first. Await every action. Use the documented browser or native desktop APIs and image helpers. Browser state and variables survive context compaction; a failed action may keep interpreter state, so follow the reported state. A deadline, cancellation or runtime restart loses interpreter state and may leave an action completed: reset explicitly and never automatically repeat an uncertain action. Each agent has its own interpreter. Headed browser tabs share one profile and serialize foreground use; the first evaluation after startup or takeover only observes."

[computer_control.tool.parameters]
type = "object"
required = ["code"]
additionalProperties = false

[computer_control.tool.parameters.properties.code]
type = "string"

[computer_control.tool.parameters.properties.reset]
type = "boolean"
description = "Discard the interpreter before this evaluation. A gateway-owned browser stays open; its first evaluation is observation-only."

[computer_control.tool.parameters.properties.timeout_ms]
type = "integer"

[[requires]]
middleware = "sandbox"
setting = "approval_policy"
value = "full_access"
reason = "Computer control operates the host browser and desktop outside the sandbox, so it needs full access."
