# Tool schemas, presentation, and defaults owned by commands.
default_timeout_ms = 120000
max_timeout_ms = 600000

[bash]
title = "Bash"
detail = "command"

[bash.tool]
name = "bash"
description = "Run a sandboxed command under the active network policy. Waits up to timeout_ms for it to finish and returns its output and exit status. A command still running then keeps running in the background: the result has status running, the output so far, and a command_id to poll or stop with manage_command. Running does not mean success. A notice arrives when it finishes, so continue other work instead of sleeping or relaunching."

[bash.tool.parameters]
type = "object"
required = ["command"]
additionalProperties = false

[bash.tool.parameters.properties]

[bash.tool.parameters.properties.command]
type = "string"

[bash.tool.parameters.properties.timeout_ms]
type = "integer"
minimum = 1
description = "Milliseconds to wait before the command moves to the background. Default 120000, capped at 600000."

[bash.tool.parameters.properties.run_in_background]
type = "boolean"
description = "Return a command_id immediately instead of waiting; use for servers and long jobs."

[manage_command]
title = "Command"
detail = "action"

[manage_command.tool]
name = "manage_command"
description = "Manage a running command returned by bash. Poll reads new output, or the final result once its completion notice arrives; stop cancels the command. Completion or stopping consumes the command ID."

[manage_command.tool.parameters]
type = "object"
required = ["command_id", "action"]
additionalProperties = false

[manage_command.tool.parameters.properties.command_id]
type = "string"
format = "uuid"

[manage_command.tool.parameters.properties.action]
type = "string"
enum = ["poll", "stop"]
