[package]
name = "mobius"
version = "0.16.45"
edition.workspace = true
rust-version.workspace = true
description = "A small, modular Rust framework for building coding agents"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/mobius"
readme = "README.md"
publish.workspace = true
keywords = ["agent", "ai", "llm", "openai", "tools"]
categories = ["asynchronous", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[lints]
workspace = true

[workspace]
members = ["crates/mobius-cli", "crates/mobius-gateway"]
default-members = ["crates/mobius-cli"]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/mobius"
publish = ["crates-io"]

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
diffy = "0.4.2"
futures-util = { version = "0.3", features = ["sink"] }
mobius = { version = "=0.16.45", path = "." }
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

[dependencies]
base64.workspace = true
bm25 = "2.3.2"
cap-std = "4"
chrono.workspace = true
diffy.workspace = true
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
regex = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
uuid.workspace = true
toml = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
whichdisk = { version = "0.6", default-features = false }

[dev-dependencies]
rusqlite = { workspace = true, features = ["hooks"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
# Tier 1: hygiene that costs nothing to keep.
unreachable_pub = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_numeric_casts = "deny"
unexpected_cfgs = "deny"
# Tier 2: never drop a value or a type's debug view silently.
let_underscore_drop = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
missing_errors_doc = "warn"
# Tier 1: no stubs or leftovers; every exception says why; share handles explicitly.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
mem_forget = "deny"
exit = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
unwrap_in_result = "deny"
missing_panics_doc = "deny"
future_not_send = "deny"
unused_async = "deny"
rc_buffer = "deny"
trivially_copy_pass_by_ref = "deny"
needless_collect = "deny"
uninlined_format_args = "deny"
# Tier 2: errors are never swallowed; numbers convert checked; locks are held briefly.
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
string_slice = "deny"
significant_drop_tightening = "deny"
needless_pass_by_value = "deny"
str_to_string = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Tier 3: production code never panics on expected failures; tests may (clippy.toml).
expect_used = "deny"
unwrap_used = "deny"
indexing_slicing = "deny"
panic = "deny"
# Tier 4: nursery lints that fit the rulebook.
significant_drop_in_scrutinee = "deny"
needless_pass_by_ref_mut = "deny"
or_fun_call = "deny"
collection_is_never_read = "deny"
set_contains_or_insert = "deny"
derive_partial_eq_without_eq = "deny"
trait_duplication_in_bounds = "deny"
type_repetition_in_bounds = "deny"
unused_peekable = "deny"
useless_let_if_seq = "deny"
branches_sharing_code = "deny"
use_self = "deny"
large_stack_frames = "deny"
# Tier 5: pedantic lints that simplify control flow, avoid allocations and keep hygiene.
single_match_else = "deny"
match_same_arms = "deny"
manual_let_else = "deny"
if_not_else = "deny"
collapsible_else_if = "deny"
nonminimal_bool = "deny"
match_bool = "deny"
match_wildcard_for_single_variants = "deny"
unnested_or_patterns = "deny"
needless_continue = "deny"
bool_to_int_with_if = "deny"
map_unwrap_or = "deny"
format_push_string = "deny"
format_collect = "deny"
assigning_clones = "deny"
unnecessary_debug_formatting = "deny"
wildcard_imports = "deny"
used_underscore_binding = "deny"
ignored_unit_patterns = "deny"
semicolon_if_nothing_returned = "deny"
items_after_statements = "deny"
unused_self = "deny"
unnecessary_wraps = "deny"
ref_option = "deny"
redundant_closure_for_method_calls = "deny"
elidable_lifetime_names = "deny"
explicit_iter_loop = "deny"
inconsistent_struct_constructor = "deny"
needless_raw_string_hashes = "deny"
unreadable_literal = "deny"
manual_midpoint = "deny"
case_sensitive_file_extension_comparisons = "deny"
cast_precision_loss = "deny"
