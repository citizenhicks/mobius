[package]
name = "mobius"
version = "0.9.8"
edition = "2024"
rust-version = "1.89"
description = "A small, modular Rust framework for building coding agents"
license = "Apache-2.0"
repository = "https://github.com/citizenhicks/mobius"
documentation = "https://docs.rs/mobius"
readme = "README.md"
publish = ["crates-io"]
keywords = ["agent", "ai", "llm", "openai", "tools"]
categories = ["asynchronous", "development-tools"]
include = [
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[lints]
workspace = true

[workspace]
members = ["crates/mobius-cli", "crates/mobius-gateway"]
default-members = ["crates/mobius-cli"]
resolver = "3"

[dependencies]
base64 = "0.22"
cap-std = "4"
diffy = "0.4.2"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
