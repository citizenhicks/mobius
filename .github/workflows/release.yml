name: Release

on:
  push:
    tags:
      - mobius-v*
      - mobius-gateway-v*
      - mobius-cli-v*

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CLOUDFLARED_VERSION: 2026.10.7

jobs:
  verify:
    name: Require verified release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release notes
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow ci.yml --branch main --event workflow_dispatch --commit "$GITHUB_SHA" \
            --status completed --json conclusion \
            --jq 'any(.[]; .conclusion == "success")' | grep -Fxq true

  publish-framework:
    name: Publish mobius
    if: startsWith(github.ref_name, 'mobius-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius") | .version')"
          test "$version" = "$manifest_version"
      - name: Publish
        run: cargo publish --locked -p mobius
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    name: Publish mobius-cli
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-cli") | .version')"
          test "$version" = "$manifest_version"
      - name: Verify dependencies were published first
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          mobius_version="$(jq -r '.packages[] | select(.name == "mobius-cli") |
            .dependencies[] | select(.name == "mobius") | .req | ltrimstr("=")' <<<"$metadata")"
          gateway_version="$(jq -r '.packages[] | select(.name == "mobius-cli") |
            .dependencies[] | select(.name == "mobius-gateway") | .req | ltrimstr("=")' <<<"$metadata")"
          cargo info --registry crates-io "mobius@$mobius_version" >/dev/null
          cargo info --registry crates-io "mobius-gateway@$gateway_version" >/dev/null
      - name: Publish
        run: cargo publish --locked -p mobius-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-gateway:
    name: Publish mobius-gateway
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") | .version')"
          test "$version" = "$manifest_version"
      - name: Verify mobius was published first
        run: |
          mobius_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") |
              .dependencies[] | select(.name == "mobius") | .req | ltrimstr("=")')"
          cargo info --registry crates-io "mobius@$mobius_version" >/dev/null
      - name: Publish
        run: cargo publish --locked -p mobius-gateway
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  gateway-binaries:
    name: Gateway binary (${{ matrix.os }})
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") | .version')"
          test "$version" = "$manifest_version"
      - run: cargo build --release --locked -p mobius-cli --bin mobius-gateway
      - run: >-
          cargo run --release --locked -p mobius-cli --example generate-man --
          target/man --date "$(date -u +%F)"
      - name: Bundle pinned cloudflared
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-gnu)
              asset="cloudflared-linux-amd64"
              checksum="1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
              ;;
            aarch64-unknown-linux-gnu)
              asset="cloudflared-linux-arm64"
              checksum="3df43aedc9ff291d1735b5cb576cb97e0b157488796db2e32b28aecabb445775"
              ;;
            x86_64-apple-darwin)
              asset="cloudflared-darwin-amd64.tgz"
              checksum="02f3edfd87684dd5b705607688e4eb4b323f6e777b81e7b3a85af556aa356848"
              ;;
            aarch64-apple-darwin)
              asset="cloudflared-darwin-arm64.tgz"
              checksum="3586ccf397e98e5f437e60e7c307ca6ac463e110580503af8bb8e6f9ebf831bd"
              ;;
            *) exit 1 ;;
          esac
          mkdir package
          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}"
          printf '%s  %s\n' "$checksum" "$asset" | shasum -a 256 --check
          if [[ "$asset" == *.tgz ]]; then
            tar -C package -xzf "$asset"
          else
            install -m 755 "$asset" package/cloudflared
          fi
          package/cloudflared --version
          curl --fail --location --silent --show-error \
            --output package/cloudflared-LICENSE \
            "https://raw.githubusercontent.com/cloudflare/cloudflared/${CLOUDFLARED_VERSION}/LICENSE"
          printf '%s  %s\n' \
            "58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd" \
            package/cloudflared-LICENSE | shasum -a 256 --check
      - name: Package binary
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          archive="mobius-gateway-${version}-${host}.tar.gz"
          mkdir dist
          mkdir -p package/share/man/man1
          cp target/release/mobius-gateway LICENSE NOTICE package/
          cp target/man/mobius-gateway*.1 package/share/man/man1/
          tar -C package -czf "dist/$archive" \
            mobius-gateway cloudflared cloudflared-LICENSE LICENSE NOTICE share/man/man1
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-binary-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  cli-binaries:
    name: CLI binary (${{ matrix.os }})
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-cli") | .version')"
          test "$version" = "$manifest_version"
      - run: cargo build --release --locked -p mobius-cli
      - run: >-
          cargo run --release --locked -p mobius-cli --example generate-man --
          target/man --date "$(date -u +%F)"
      - name: Bundle pinned cloudflared
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-gnu)
              asset="cloudflared-linux-amd64"
              checksum="1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872"
              ;;
            aarch64-unknown-linux-gnu)
              asset="cloudflared-linux-arm64"
              checksum="3df43aedc9ff291d1735b5cb576cb97e0b157488796db2e32b28aecabb445775"
              ;;
            x86_64-apple-darwin)
              asset="cloudflared-darwin-amd64.tgz"
              checksum="02f3edfd87684dd5b705607688e4eb4b323f6e777b81e7b3a85af556aa356848"
              ;;
            aarch64-apple-darwin)
              asset="cloudflared-darwin-arm64.tgz"
              checksum="3586ccf397e98e5f437e60e7c307ca6ac463e110580503af8bb8e6f9ebf831bd"
              ;;
            *) exit 1 ;;
          esac
          mkdir package
          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}"
          printf '%s  %s\n' "$checksum" "$asset" | shasum -a 256 --check
          if [[ "$asset" == *.tgz ]]; then
            tar -C package -xzf "$asset"
          else
            install -m 755 "$asset" package/cloudflared
          fi
          package/cloudflared --version
          curl --fail --location --silent --show-error \
            --output package/cloudflared-LICENSE \
            "https://raw.githubusercontent.com/cloudflare/cloudflared/${CLOUDFLARED_VERSION}/LICENSE"
          printf '%s  %s\n' \
            "58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd" \
            package/cloudflared-LICENSE | shasum -a 256 --check
      - name: Package binary
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          archive="mobius-${version}-${host}.tar.gz"
          mkdir dist
          mkdir -p package/share/man/man1
          cp target/release/mobius target/release/mobius-gateway LICENSE NOTICE package/
          cp target/man/*.1 package/share/man/man1/
          tar -C package -czf "dist/$archive" \
            mobius mobius-gateway cloudflared cloudflared-LICENSE LICENSE NOTICE share/man/man1
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  framework-release:
    name: Framework GitHub release
    if: startsWith(github.ref_name, 'mobius-v')
    needs: publish-framework
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-v}"
          gh release create "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius $version" \
            --verify-tag

  gateway-release:
    name: Gateway GitHub release
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs:
      - publish-gateway
      - gateway-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius Gateway $version" \
            --verify-tag

  cli-release:
    name: CLI GitHub release
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs:
      - publish-cli
      - cli-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius CLI $version" \
            --verify-tag
