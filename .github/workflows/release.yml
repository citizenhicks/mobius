name: Release

on:
  push:
    tags:
      - mobius-v*
      - mobius-gateway-v*
      - mobius-cli-v*

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLOUDFLARED_VERSION: 2026.7.3

jobs:
  verify:
    name: Verify release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release notes
        run: test -s ".github/release-notes/${GITHUB_REF_NAME}.md"
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - name: Check Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Install Bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: cargo test --workspace --all-targets --all-features --locked

  publish-framework:
    name: Publish mobius
    if: startsWith(github.ref_name, 'mobius-v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius") | .version')"
          test "$version" = "$manifest_version"
      - name: Publish
        run: cargo publish --locked -p mobius
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-cli:
    name: Publish mobius-cli
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-cli") | .version')"
          test "$version" = "$manifest_version"
      - name: Verify dependencies were published first
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          mobius_version="$(jq -r '.packages[] | select(.name == "mobius-cli") |
            .dependencies[] | select(.name == "mobius") | .req | ltrimstr("=")' <<<"$metadata")"
          gateway_version="$(jq -r '.packages[] | select(.name == "mobius-cli") |
            .dependencies[] | select(.name == "mobius-gateway") | .req | ltrimstr("=")' <<<"$metadata")"
          cargo info --registry crates-io "mobius@$mobius_version" >/dev/null
          cargo info --registry crates-io "mobius-gateway@$gateway_version" >/dev/null
      - name: Publish
        run: cargo publish --locked -p mobius-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-gateway:
    name: Publish mobius-gateway
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") | .version')"
          test "$version" = "$manifest_version"
      - name: Verify mobius was published first
        run: |
          mobius_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") |
              .dependencies[] | select(.name == "mobius") | .req | ltrimstr("=")')"
          cargo info --registry crates-io "mobius@$mobius_version" >/dev/null
      - name: Publish
        run: cargo publish --locked -p mobius-gateway
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  gateway-binaries:
    name: Gateway binary (${{ matrix.os }})
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-gateway") | .version')"
          test "$version" = "$manifest_version"
      - run: cargo build --release --locked -p mobius-cli --bin mobius-gateway
      - name: Bundle pinned cloudflared
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-gnu)
              asset="cloudflared-linux-amd64"
              checksum="9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
              ;;
            aarch64-unknown-linux-gnu)
              asset="cloudflared-linux-arm64"
              checksum="65259e652a7bea08bf5df603233ab22b8bf3116af8df9f9206209af6a1b955c0"
              ;;
            x86_64-apple-darwin)
              asset="cloudflared-darwin-amd64.tgz"
              checksum="70d1c8684fa6d14b5843787ec8d1ea8e18b23650e424f4ea43d849a506487c3b"
              ;;
            aarch64-apple-darwin)
              asset="cloudflared-darwin-arm64.tgz"
              checksum="90c5a4f914d705fd70c135dba6d80b1791d254b08d6d4136301941f88330dd09"
              ;;
            *) exit 1 ;;
          esac
          mkdir package
          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}"
          printf '%s  %s\n' "$checksum" "$asset" | shasum -a 256 --check
          if [[ "$asset" == *.tgz ]]; then
            tar -C package -xzf "$asset"
          else
            install -m 755 "$asset" package/cloudflared
          fi
          package/cloudflared --version
          curl --fail --location --silent --show-error \
            --output package/cloudflared-LICENSE \
            "https://raw.githubusercontent.com/cloudflare/cloudflared/${CLOUDFLARED_VERSION}/LICENSE"
          printf '%s  %s\n' \
            "58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd" \
            package/cloudflared-LICENSE | shasum -a 256 --check
      - name: Package binary
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          archive="mobius-gateway-${version}-${host}.tar.gz"
          mkdir dist
          cp target/release/mobius-gateway LICENSE NOTICE package/
          tar -C package -czf "dist/$archive" \
            mobius-gateway cloudflared cloudflared-LICENSE LICENSE NOTICE
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-binary-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  cli-binaries:
    name: CLI binary (${{ matrix.os }})
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Verify tag version
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          manifest_version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mobius-cli") | .version')"
          test "$version" = "$manifest_version"
      - run: cargo build --release --locked -p mobius-cli
      - name: Bundle pinned cloudflared
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-gnu)
              asset="cloudflared-linux-amd64"
              checksum="9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17"
              ;;
            aarch64-unknown-linux-gnu)
              asset="cloudflared-linux-arm64"
              checksum="65259e652a7bea08bf5df603233ab22b8bf3116af8df9f9206209af6a1b955c0"
              ;;
            x86_64-apple-darwin)
              asset="cloudflared-darwin-amd64.tgz"
              checksum="70d1c8684fa6d14b5843787ec8d1ea8e18b23650e424f4ea43d849a506487c3b"
              ;;
            aarch64-apple-darwin)
              asset="cloudflared-darwin-arm64.tgz"
              checksum="90c5a4f914d705fd70c135dba6d80b1791d254b08d6d4136301941f88330dd09"
              ;;
            *) exit 1 ;;
          esac
          mkdir package
          curl --fail --location --silent --show-error \
            --output "$asset" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/${asset}"
          printf '%s  %s\n' "$checksum" "$asset" | shasum -a 256 --check
          if [[ "$asset" == *.tgz ]]; then
            tar -C package -xzf "$asset"
          else
            install -m 755 "$asset" package/cloudflared
          fi
          package/cloudflared --version
          curl --fail --location --silent --show-error \
            --output package/cloudflared-LICENSE \
            "https://raw.githubusercontent.com/cloudflare/cloudflared/${CLOUDFLARED_VERSION}/LICENSE"
          printf '%s  %s\n' \
            "58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd" \
            package/cloudflared-LICENSE | shasum -a 256 --check
      - name: Package binary
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          archive="mobius-${version}-${host}.tar.gz"
          mkdir dist
          cp target/release/mobius target/release/mobius-gateway LICENSE NOTICE package/
          tar -C package -czf "dist/$archive" \
            mobius mobius-gateway cloudflared cloudflared-LICENSE LICENSE NOTICE
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  framework-release:
    name: Framework GitHub release
    if: startsWith(github.ref_name, 'mobius-v')
    needs: publish-framework
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-v}"
          gh release create "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius $version" \
            --verify-tag

  gateway-release:
    name: Gateway GitHub release
    if: startsWith(github.ref_name, 'mobius-gateway-v')
    needs:
      - publish-gateway
      - gateway-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-gateway-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius Gateway $version" \
            --verify-tag

  cli-release:
    name: CLI GitHub release
    if: startsWith(github.ref_name, 'mobius-cli-v')
    needs:
      - publish-cli
      - cli-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#mobius-cli-v}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "möbius CLI $version" \
            --verify-tag
