name: Swift

on:
  push:
    paths:
      - mobius-app/apple/**
      - .github/workflows/swift.yml
  pull_request:
    paths:
      - mobius-app/apple/**
      - .github/workflows/swift.yml

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, complexity, tests, and Release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: mobius-app/apple
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify toolchain
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          grep -Fxq 'Xcode 26.6' <<<"$xcode_version"
          grep -Fxq 'Build version 17F113' <<<"$xcode_version"
          xcrun swift --version
          xcrun swift-format --version
          runtimes="$(xcrun simctl list runtimes available --json)"
          printf '%s\n' "$runtimes"
          printf '%s' "$runtimes" | jq -e '
            any(.runtimes[]; .isAvailable == true and .name == "iOS 26.5" and
              .identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5")
          ' >/dev/null
      - name: Check formatting
        run: xcrun swift-format lint --configuration .swift-format --strict --recursive Sources Tests
      - name: Check complexity
        run: |
          tool_dir="$RUNNER_TEMP/swift-complexity"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/fummicc1/swift-complexity/releases/download/v1.4.0/SwiftComplexityCLI-1.4.0-macos-arm64.tar.gz \
            -o "$tool_dir/tool.tgz"
          printf '%s  %s\n' \
            599ab9d4bf2e12775eb93f4a03ce8b3e3940c349ee63a0131e0c23f9d3941b98 \
            "$tool_dir/tool.tgz" | shasum -a 256 -c -
          tar -xzf "$tool_dir/tool.tgz" -C "$tool_dir"
          "$tool_dir/SwiftComplexityCLI-1.4.0-macos-arm64/SwiftComplexityCLI" \
            Sources Tests --recursive --threshold 21 --report-suppressions
      - name: Run signed simulator tests
        run: |
          xcodebuild -project MobiusApp.xcodeproj -scheme MobiusApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -derivedDataPath "$RUNNER_TEMP/SwiftDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipMacroValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/SwiftTests.xcresult" test
      - name: Build unsigned device Release
        run: |
          xcodebuild -project MobiusApp.xcodeproj -scheme MobiusApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SwiftReleaseDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-results
          path: ${{ runner.temp }}/SwiftTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
