name: Desktop CI

on:
  pull_request:
    paths:
      - apps/macos/**
      - src/**
      - crates/mobius-gateway/**
      - Cargo.toml
      - .github/sync-gateway-contract.py
      - .github/workflows/desktop-*.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Desktop Rust and native checks
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component clippy --component rustfmt
      - name: Select the browser SDK cache directory
        run: |
          printf 'CEF_PATH=%s/mobius-cef\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sdk_version="$(awk '/^name = "cef-dll-sys"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)"
          test -n "$sdk_version"
          printf 'CEF_CACHE_VERSION=%s\n' "$sdk_version" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/macos -> target
      - name: Cache the pinned browser SDK outside Cargo target cleanup
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ env.CEF_CACHE_VERSION }}
      - name: Install the Metal Toolchain for SwiftTerm
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install the build tools for Chromium's bindings
        run: brew install cmake ninja
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sh scripts/rules.sh
      - run: cargo fmt --all -- --check
      - name: Check the pinned Rust toolchain
        run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: python3 scripts/check-native.py
